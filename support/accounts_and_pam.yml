  - name: Gather package facts
    ansible.builtin.package_facts:
      manager: auto

  - name: Ensure sudo is installed
    dnf:
      name: sudo
      state: present
      use_backend: dnf
    when: '"kernel-core" in ansible_facts.packages'
    tags:
    - CCE-87100-4
    - NIST-800-53-CM-6(a)
    - PCI-DSSv4-2.2
    - PCI-DSSv4-2.2.6
    - enable_strategy
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - package_sudo_installed

  - name: Find /etc/sudoers.d/ files
