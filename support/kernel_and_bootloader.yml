    - CCE-90140-5
    - NIST-800-53-SC-3
    - grub2_init_on_free
    - low_disruption
    - medium_complexity
    - medium_severity
    - reboot_required
    - restrict_strategy
    - dangerous

  - name: Check if init_on_free argument is already present
