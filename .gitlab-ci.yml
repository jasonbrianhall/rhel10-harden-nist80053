---
# Runs against the self-hosted GitLab Runner registered with
# register_gitlab_runner.sh (--tls-skip-verify). Also disables TLS
# verification for this pipeline's own git operations, in case the
# runner-wide setting isn't in place yet.
variables:
  GIT_SSL_NO_VERIFY: "true"

stages:
  - boot
  - hardening
  - compliance
  - ami

boot_vm:
  stage: boot
  tags:
    - rhel-hardening
  script:
    - ./run_aws.sh
  artifacts:
    paths:
      - .vm_ip
    expire_in: 1 day

run_hardening:
  stage: hardening
  tags:
    - rhel-hardening
  needs:
    - boot_vm
  script:
    - ./run_aws.sh hardening

check_oscap:
  stage: compliance
  tags:
    - rhel-hardening
  needs:
    - boot_vm
    - run_hardening
  script:
    - ./run_aws.sh check_oscap
  artifacts:
    paths:
      - scap-results/
      - .oscap_score
    expire_in: 30 days
    when: always

create_ami:
  stage: ami
  tags:
    - rhel-hardening
  needs:
    - boot_vm
    - check_oscap
  when: manual
  script:
    - ./run_aws.sh create_ami
  artifacts:
    paths:
      - .vm_ami_id
    expire_in: 30 days
