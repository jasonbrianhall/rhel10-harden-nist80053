###############################################################################
# Auto-split from rhel10-remediation.yml (OpenSCAP RHEL 10 STIG playbook)
# Functional area: kernel_and_bootloader
# sysctl, kernel modules, GRUB/bootloader, kernel command line, core dumps.
#
# 150 tasks total, 31 tagged `dangerous` (can lock you out / break
# the system -- e.g. root login restriction, account lockout, package
# removal, service disabling, mount option changes, SELinux enforcing, FIPS,
# GRUB changes). Each dangerous task also has a "# DANGEROUS:" comment above
# it in this file. Skip them with:
#   ansible-playbook kernel_and_bootloader.yml --skip-tags dangerous
# Or run ONLY them with:
#   ansible-playbook kernel_and_bootloader.yml --tags dangerous
###############################################################################
- hosts: all
  vars:
    sysctl_net_ipv6_conf_all_accept_ra_value: '0'
    sysctl_net_ipv6_conf_all_accept_redirects_value: '0'
    sysctl_net_ipv6_conf_all_accept_source_route_value: '0'
    sysctl_net_ipv6_conf_all_forwarding_value: '0'
    sysctl_net_ipv6_conf_default_accept_ra_value: '0'
    sysctl_net_ipv6_conf_default_accept_redirects_value: '0'
    sysctl_net_ipv6_conf_default_accept_source_route_value: '0'
    sysctl_net_ipv4_conf_all_accept_redirects_value: '0'
    sysctl_net_ipv4_conf_all_accept_source_route_value: '0'
    sysctl_net_ipv4_conf_all_forwarding_value: '0'
    sysctl_net_ipv4_conf_all_rp_filter_value: '1'
    sysctl_net_ipv4_conf_default_accept_redirects_value: '0'
    sysctl_net_ipv4_conf_default_accept_source_route_value: '0'
    sysctl_net_ipv4_conf_default_rp_filter_value: '1'
    sysctl_net_ipv4_icmp_echo_ignore_broadcasts_value: '1'
    sysctl_net_ipv4_icmp_ignore_bogus_error_responses_value: '1'
    sysctl_net_ipv4_tcp_invalid_ratelimit_value: '500'
    sysctl_net_ipv4_tcp_syncookies_value: '1'
    sysctl_kernel_kptr_restrict_value: '1'
    var_audit_backlog_limit: '8192'
