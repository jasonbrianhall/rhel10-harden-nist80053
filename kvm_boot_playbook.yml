---
- name: Clone RHEL KVM image, boot VM, and get IP address
  hosts: localhost
  gather_facts: yes
  become: yes
  vars:
    # Configuration - customize these
    source_image: "/var/lib/libvirt/images/rhel10-test.qcow2"
    target_image: "/var/lib/libvirt/images/{{ vm_name }}.qcow2"
    vm_name: "rhel-hardened-{{ ansible_date_time.iso8601_basic_short }}"
    vm_memory: 2048
    vm_vcpus: 2
    vm_network: "default"
    boot_timeout: 300  # seconds to wait for VM to boot
    ip_poll_interval: 5  # seconds between IP address checks
    ip_poll_retries: 60  # number of times to check for IP

    # Hardening playbooks - set to true to run, false to skip
    run_verification: true
    run_ssh_hardening: false
    run_accounts_and_pam_hardening: false
    run_audit_and_logging_hardening: false
    run_selinux_hardening: false
    run_filesystem_and_mounts_hardening: false
    run_kernel_and_bootloader_hardening: false
    run_network_and_firewall_hardening: false
    run_software_and_services_hardening: false
    run_session_and_display_hardening: false
    run_time_sync_and_mail_hardening: false
    run_file_integrity_hardening: false
    run_identity_and_smartcard_hardening: false
    run_uncategorized_hardening: false

    hardening_dir: support

  tasks:
    - name: Check if source image exists
      stat:
        path: "{{ source_image }}"
      register: source_stat
      failed_when: not source_stat.stat.exists

    - name: Create copy of base image
      command: "cp {{ source_image }} {{ target_image }}"
      register: copy_result
      changed_when: copy_result.rc == 0

    - name: Define VM from XML template
      community.libvirt.virt:
        name: "{{ vm_name }}"
        command: define
        xml: |
          <domain type='kvm'>
            <name>{{ vm_name }}</name>
            <memory unit='MiB'>{{ vm_memory }}</memory>
            <currentMemory unit='MiB'>{{ vm_memory }}</currentMemory>
            <vcpu placement='static'>{{ vm_vcpus }}</vcpu>
            <os>
              <type arch='x86_64'>hvm</type>
              <boot dev='hd'/>
            </os>
            <devices>
              <emulator>/usr/bin/qemu-system-x86_64</emulator>
              <disk type='file' device='disk'>
                <driver name='qemu' type='qcow2'/>
                <source file='{{ target_image }}'/>
                <target dev='vda' bus='virtio'/>
              </disk>
              <interface type='network'>
                <source network='{{ vm_network }}'/>
                <model type='virtio'/>
              </interface>
              <console type='pty'>
                <target type='virtio' port='0'/>
              </console>
              <graphics type='spice' port='-1' autoport='yes'/>
              <channel type='spicevmc'>
                <target type='virtio' name='com.redhat.spice.0'/>
              </channel>
            </devices>
          </domain>

    - name: Start the VM
      community.libvirt.virt:
        name: "{{ vm_name }}"
        state: running

    - name: Wait for VM to be running
      community.libvirt.virt:
        name: "{{ vm_name }}"
        command: status
      register: vm_status
      until: vm_status.status == 'running'
      retries: 10
      delay: 2

    - name: Wait for network interface to come up
      pause:
        seconds: 10

    - name: Get VM IP address
      block:
        - name: Query VM IP address via libvirt
          shell: |
            virsh domifaddr {{ vm_name }} | grep ipv4 | awk '{print $4}' | cut -d'/' -f1
          register: vm_ip_result
          until: vm_ip_result.stdout != ""
          retries: "{{ ip_poll_retries }}"
          delay: "{{ ip_poll_interval }}"
          changed_when: false

        - name: Display VM information
          debug:
            msg: |
              VM created successfully!
              VM Name: {{ vm_name }}
              Image: {{ target_image }}
              IP Address: {{ vm_ip_result.stdout }}
              Memory: {{ vm_memory }} MiB
              vCPUs: {{ vm_vcpus }}

        - name: Set fact for VM IP
          set_fact:
            rhel_vm_ip: "{{ vm_ip_result.stdout }}"

    - name: Verify SSH connectivity to VM
      wait_for:
        host: "{{ rhel_vm_ip }}"
        port: 22
        delay: 5
        timeout: "{{ boot_timeout }}"
      register: ssh_check

    - name: Add VM to in-memory inventory
      add_host:
        name: "{{ vm_name }}"
        ansible_host: "{{ rhel_vm_ip }}"
        ansible_user: cloud-user
        ansible_ssh_private_key_file: /root/.ssh/id_rsa
        groups: new_vms

    - name: Summary
      debug:
        msg: |
          Ready for hardening!
          Connect to VM: ssh cloud-user@{{ rhel_vm_ip }}
          Run hardening playbook with:
          ansible-playbook -i {{ rhel_vm_ip }}, hardening.yml

- name: Run verification on new VM (as cloud-user)
  hosts: new_vms
  gather_facts: yes
  remote_user: cloud-user
  become: no
  vars:
    verification_playbook: verify.yml
  tasks:
    - name: Verify VM is responsive
      debug:
        msg: "VM {{ inventory_hostname }} is online and accessible"
      when: hostvars['localhost'].run_verification

    - name: Run verification playbook
      include_tasks: "{{ verification_playbook }}"
      ignore_errors: yes
      when: hostvars['localhost'].run_verification

- name: Run RHEL STIG hardening (as cloud-user)
  hosts: new_vms
  gather_facts: no
  remote_user: cloud-user
  become: no
  vars:
    hardening_dir: "{{ hostvars['localhost'].hardening_dir }}"
  tasks:
    - name: Include SSH hardening
      include_tasks: "{{ hardening_dir }}/ssh.yml"
      when: hostvars['localhost'].run_ssh_hardening

    - name: Include accounts and PAM hardening
      include_tasks: "{{ hardening_dir }}/accounts_and_pam.yml"
      when: hostvars['localhost'].run_accounts_and_pam_hardening

    - name: Include audit and logging hardening
      include_tasks: "{{ hardening_dir }}/audit_and_logging.yml"
      when: hostvars['localhost'].run_audit_and_logging_hardening

    - name: Include SELinux hardening
      include_tasks: "{{ hardening_dir }}/selinux.yml"
      when: hostvars['localhost'].run_selinux_hardening

    - name: Include filesystem and mounts hardening
      include_tasks: "{{ hardening_dir }}/filesystem_and_mounts.yml"
      when: hostvars['localhost'].run_filesystem_and_mounts_hardening

    - name: Include kernel and bootloader hardening
      include_tasks: "{{ hardening_dir }}/kernel_and_bootloader.yml"
      when: hostvars['localhost'].run_kernel_and_bootloader_hardening

    - name: Include network and firewall hardening
      include_tasks: "{{ hardening_dir }}/network_and_firewall.yml"
      when: hostvars['localhost'].run_network_and_firewall_hardening

    - name: Include software and services hardening
      include_tasks: "{{ hardening_dir }}/software_and_services.yml"
      when: hostvars['localhost'].run_software_and_services_hardening

    - name: Include session and display hardening
      include_tasks: "{{ hardening_dir }}/session_and_display.yml"
      when: hostvars['localhost'].run_session_and_display_hardening

    - name: Include time sync and mail hardening
      include_tasks: "{{ hardening_dir }}/time_sync_and_mail.yml"
      when: hostvars['localhost'].run_time_sync_and_mail_hardening

    - name: Include file integrity hardening
      include_tasks: "{{ hardening_dir }}/file_integrity.yml"
      when: hostvars['localhost'].run_file_integrity_hardening

    - name: Include identity and smartcard hardening
      include_tasks: "{{ hardening_dir }}/identity_and_smartcard.yml"
      when: hostvars['localhost'].run_identity_and_smartcard_hardening

    - name: Include uncategorized hardening
      include_tasks: "{{ hardening_dir }}/uncategorized.yml"
      when: hostvars['localhost'].run_uncategorized_hardening
