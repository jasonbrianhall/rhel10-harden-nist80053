---
###############################################################################
# Auto-split from rhel10-remediation.yml (OpenSCAP RHEL 10 STIG playbook)
# Functional area: session_and_display
# GNOME/dconf, screensaver, login banners, Ctrl-Alt-Del, session/idle timeouts.
#
# 61 tasks total, 5 tagged `dangerous` (can lock you out / break
# the system -- e.g. root login restriction, account lockout, package
# removal, service disabling, mount option changes, SELinux enforcing, FIPS,
# GRUB changes). Each dangerous task also has a "# DANGEROUS:" comment above
# it in this file. Skip them with:
#   ansible-playbook session_and_display.yml --skip-tags dangerous
# Or run ONLY them with:
#   ansible-playbook session_and_display.yml --tags dangerous
###############################################################################
- hosts: all
  become: true
  become_method: sudo
  become_user: root

  vars:
    inactivity_timeout_value: '900'
    var_screensaver_lock_delay: '5'
    login_banner_contents: You are accessing a U.S. Government (USG) Information System (IS) that is\nprovided for USG-authorized use only. By using this IS (which includes any\ndevice attached to this IS), you consent to the following conditions:\n\n-The USG routinely intercepts and monitors communications on this IS for\npurposes including, but not limited to, penetration testing, COMSEC monitoring,\nnetwork operations and defense, personnel misconduct (PM), law enforcement\n(LE), and counterintelligence (CI) investigations.\n\n-At any time, the USG may inspect and seize data stored on this IS.\n\n-Communications using, or data stored on, this IS are not private, are subject\nto routine monitoring, interception, and search, and may be disclosed or used\nfor any USG-authorized purpose.\n\n-This IS includes security measures (e.g., authentication and access controls)\nto protect USG interests--not for your personal benefit or privacy.\n\n-Notwithstanding the above, using this IS does not constitute consent to PM, LE\nor CI investigative searching or monitoring of the content of privileged\ncommunications, or work product, related to personal representation or services\nby attorneys, psychotherapists, or clergy, and their assistants. Such\ncommunications and work product are private and confidential. See User\nAgreement for details.
    dconf_login_banner_contents: Authorized users only. All activity may be monitored and reported.
    var_accounts_tmout: '900'
  tasks:
  - name: Gather the package facts
    package_facts:
      manager: auto
    tags:
    - CCE-90477-1
    - CJIS-5.10.1.3
    - NIST-800-53-CM-6(a)
    - PCI-DSS-Req-11.5
    - PCI-DSSv4-11.5.2
    - enable_strategy
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - package_aide_installed


  - name: Make sure that the dconf databases are up-to-date with regards to respective keyfiles - Get database modification time for distro
    ansible.builtin.stat:
      path: /etc/dconf/db/distro
    register: distro_db
    when:
    - '"gdm" in ansible_facts.packages'
    - '"kernel-core" in ansible_facts.packages'
    tags:
    - CCE-86609-5
    - PCI-DSS-Req-6.2
    - PCI-DSSv4-8.2
    - PCI-DSSv4-8.2.8
    - dconf_db_up_to_date
    - high_severity
    - low_complexity
    - medium_disruption
    - no_reboot_needed
    - unknown_strategy

  - name: Make sure that the dconf databases are up-to-date with regards to respective keyfiles - Get keyfiles for distro
    ansible.builtin.find:
      paths: /etc/dconf/db/distro.d/
    register: distro_keyfiles
    when:
    - '"gdm" in ansible_facts.packages'
    - '"kernel-core" in ansible_facts.packages'
    tags:
    - CCE-86609-5
    - PCI-DSS-Req-6.2
    - PCI-DSSv4-8.2
    - PCI-DSSv4-8.2.8
    - dconf_db_up_to_date
    - high_severity
    - low_complexity
    - medium_disruption
    - no_reboot_needed
    - unknown_strategy

  - name: Make sure that the dconf databases are up-to-date with regards to respective keyfiles - Run dconf update for distro
    ansible.builtin.command:
      cmd: dconf update
    when:
    - '"gdm" in ansible_facts.packages'
    - '"kernel-core" in ansible_facts.packages'
    - not distro_db.stat.exists or distro_keyfiles.files | length > 0 and distro_keyfiles.files | map(attribute='mtime') | max > distro_db.stat.mtime
    tags:
    - CCE-86609-5
    - PCI-DSS-Req-6.2
    - PCI-DSSv4-8.2
    - PCI-DSSv4-8.2.8
    - dconf_db_up_to_date
    - high_severity
    - low_complexity
    - medium_disruption
    - no_reboot_needed
    - unknown_strategy

