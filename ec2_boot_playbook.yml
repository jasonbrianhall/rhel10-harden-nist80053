---
# NOTE: Targets AWS GovCloud (US). GovCloud is a separate partition with its
# own IAM/credentials (not shared with a commercial AWS account) - make sure
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (or the instance profile) belong
# to the GovCloud account, and aws_region is a us-gov-* region.
- name: Find RHEL10 AMI, boot EC2 instance, and get IP address
  hosts: localhost
  gather_facts: yes
  connection: local
  vars:
    # Configuration - customize these
    vm_name: "rhel-hardened-{{ ansible_date_time.iso8601_basic_short }}"
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('us-gov-east-1', true) }}"
    instance_type: "t3a.medium"
    root_volume_size: 20

    # AMI lookup - matched against RHEL10 x86_64 images by description
    # Note: Red Hat publishes under a different account ID in GovCloud than
    # in standard AWS partitions (309956199498).
    ami_owner: "219670896067"   # Red Hat's AWS GovCloud account
    # Confirmed via `aws ec2 describe-images --image-ids <id>`: GovCloud RHEL
    # images carry an ITAR-disclaimer Description, not a fixed "Provided by
    # Red Hat, Inc." string, so match on Name instead.
    ami_name_filter: "RHEL-10*_HVM-*-x86_64-*"

    # Networking - leave blank to auto-detect from the instance this play runs on
    subnet_id: ""
    assign_public_ip: false

    # Security group - looked up by name in the target VPC; created
    # automatically (SSH-only from allowed_ssh_cidr) if it doesn't exist yet
    security_group_name: "Allow SSH from 10.0.0.0/8 Subnet"
    allowed_ssh_cidr: "10.0.0.0/8"

    # SSH access to the new instance
    # AWS EC2 only accepts RSA or ED25519 key pairs (ECDSA is rejected by
    # CreateKeyPair/ImportKeyPair). RSA (>=3072-bit) is FIPS 140 approved for
    # SSH under RHEL's FIPS crypto policy; ED25519 is not - so RSA is used.
    ssh_key_name: "Hardening_SSH_Key"
    ssh_key_bits: 4096
    ssh_key_dir: "{{ ansible_env.HOME }}/.ssh"
    ssh_private_key_file: "{{ ssh_key_dir }}/hardening_ssh_key"
    ssh_public_key_file: "{{ ssh_private_key_file }}.pub"
    ssh_secret_name: "rhel10_ssh_secret"
    ec2_user: "ec2-user"

    boot_timeout: 300  # seconds to wait for SSH to come up

    # Hardening playbooks - set to true to run, false to skip
    run_verification: true
    hardening_dir: support

    # Subscription Manager credentials
    rhel_username: "{{ lookup('env', 'RHEL_USER') }}"
    rhel_password: "{{ lookup('env', 'RHEL_PASS') }}"

  tasks:
    - name: Check if .vm_ip file exists
      stat:
        path: ".vm_ip"
      register: vm_ip_file
      changed_when: false

    - name: Skip VM creation if .vm_ip exists
      meta: end_host
      when: vm_ip_file.stat.exists

    - name: Gather EC2 metadata facts for this host
      amazon.aws.ec2_metadata_facts:

    - name: Look up this instance's networking (for same-subnet default)
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        instance_ids:
          - "{{ ansible_ec2_instance_id }}"
      register: current_instance
      when: subnet_id == ""

    - name: Resolve subnet to launch into
      set_fact:
        resolved_subnet_id: "{{ subnet_id if subnet_id != '' else current_instance.instances[0].subnet_id }}"

    - name: Get VPC for resolved subnet
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        subnet_ids:
          - "{{ resolved_subnet_id }}"
      register: resolved_subnet_info

    - name: Find or create "{{ security_group_name }}" security group
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        description: "Allow SSH only from {{ allowed_ssh_cidr }}"
        region: "{{ aws_region }}"
        vpc_id: "{{ resolved_subnet_info.subnets[0].vpc_id }}"
        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: "{{ allowed_ssh_cidr }}"
            rule_desc: "SSH from {{ allowed_ssh_cidr }}"
        purge_rules: true
        purge_rules_egress: false
      register: ssh_sg

    - name: Explicitly set Name tag on the security group
      amazon.aws.ec2_tag:
        region: "{{ aws_region }}"
        resource: "{{ ssh_sg.group_id }}"
        tags:
          Name: "{{ security_group_name }}"
        state: present

    - name: Set resolved security group id
      set_fact:
        resolved_security_group_ids:
          - "{{ ssh_sg.group_id }}"

    - name: Ensure ~/.ssh directory exists
      file:
        path: "{{ ssh_key_dir }}"
        state: directory
        mode: '0700'

    - name: Check for existing local "{{ ssh_key_name }}" key pair
      stat:
        path: "{{ ssh_private_key_file }}"
      register: local_key_stat

    - name: Attempt to fetch existing secret from AWS Secrets Manager
      set_fact:
        existing_ssh_secret_raw: "{{ lookup('amazon.aws.secretsmanager_secret', ssh_secret_name, region=aws_region, on_missing='skip') }}"
      no_log: true

    - name: 'Extract private key from secret JSON ({"Value": "..."})'
      set_fact:
        existing_ssh_secret: "{{ (existing_ssh_secret_raw | from_json).Value if existing_ssh_secret_raw | length > 0 else '' }}"
      no_log: true

    - name: Write private key from Secrets Manager (source of truth) to local file
      copy:
        content: "{{ existing_ssh_secret }}"
        dest: "{{ ssh_private_key_file }}"
        mode: '0600'
      when: existing_ssh_secret | length > 0
      no_log: true

    - name: Warn if local key existed but did not match the secret
      debug:
        msg: >-
          Local key at {{ ssh_private_key_file }} did not match the secret
          {{ ssh_secret_name }} in Secrets Manager; overwrote local copy with
          the value from Secrets Manager so they stay in sync.
      when:
        - existing_ssh_secret | length > 0
        - local_key_stat.stat.exists
        - local_key_stat.stat.checksum != (existing_ssh_secret | hash('sha1'))

    - name: Regenerate public key from Secrets Manager private key
      command: >
        ssh-keygen -y -f {{ ssh_private_key_file }}
      register: derived_pubkey
      changed_when: false
      when: existing_ssh_secret | length > 0

    - name: Write derived public key file
      copy:
        content: "{{ derived_pubkey.stdout }} {{ ssh_key_name }}\n"
        dest: "{{ ssh_public_key_file }}"
        mode: '0644'
      when: existing_ssh_secret | length > 0

    - name: Generate FIPS-compliant RSA {{ ssh_key_bits }}-bit key pair (no existing secret or local key)
      command: >
        ssh-keygen -t rsa -b {{ ssh_key_bits }}
        -f {{ ssh_private_key_file }}
        -N ""
        -C "{{ ssh_key_name }}"
      when:
        - existing_ssh_secret | length == 0
        - not local_key_stat.stat.exists

    - name: Lock down private key permissions
      file:
        path: "{{ ssh_private_key_file }}"
        mode: '0600'

    - name: Recommend adding the key to Secrets Manager
      debug:
        msg: >-
          No secret named "{{ ssh_secret_name }}" was found in AWS Secrets
          Manager (region {{ aws_region }}).
          {{ 'Using the existing local key pair at ' + ssh_private_key_file + '.'
             if local_key_stat.stat.exists
             else 'A new local key pair was generated at ' + ssh_private_key_file + '.' }}
          You should add this key to Secrets Manager as "{{ ssh_secret_name }}"
          so future runs pull the same key.
      when: existing_ssh_secret | length == 0

    - name: Import/verify "{{ ssh_key_name }}" key pair in AWS
      amazon.aws.ec2_key:
        name: "{{ ssh_key_name }}"
        region: "{{ aws_region }}"
        key_material: "{{ lookup('file', ssh_public_key_file) }}"
        state: present
      register: aws_key

    - name: Find latest RHEL10 x86_64 AMI
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners:
          - "{{ ami_owner }}"
        filters:
          name: "{{ ami_name_filter }}"
          architecture: "x86_64"
          root-device-type: "ebs"
          virtualization-type: "hvm"
          state: "available"
      register: rhel_amis
      failed_when: rhel_amis.images | length == 0

    - name: Select most recent AMI
      set_fact:
        rhel_ami_id: "{{ (rhel_amis.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        name: "{{ vm_name }}"
        region: "{{ aws_region }}"
        image_id: "{{ rhel_ami_id }}"
        instance_type: "{{ instance_type }}"
        subnet_id: "{{ resolved_subnet_id }}"
        security_groups: "{{ resolved_security_group_ids }}"
        key_name: "{{ ssh_key_name }}"
        network:
          assign_public_ip: "{{ assign_public_ip }}"
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: "{{ root_volume_size }}"
              delete_on_termination: true
        tags:
          Name: "{{ vm_name }}"
        wait: yes
        wait_timeout: "{{ boot_timeout }}"
        state: running
      register: ec2_launch

    - name: Determine VM IP address
      set_fact:
        rhel_vm_ip: "{{ ec2_launch.instances[0].public_ip_address | default('', true) or ec2_launch.instances[0].private_ip_address }}"

    - name: Display VM information
      debug:
        msg: |
          VM created successfully!
          VM Name: {{ vm_name }}
          Instance ID: {{ ec2_launch.instances[0].instance_id }}
          AMI: {{ rhel_ami_id }}
          IP Address: {{ rhel_vm_ip }}
          Instance Type: {{ instance_type }}
          Subnet: {{ resolved_subnet_id }}

    - name: Verify SSH connectivity to VM
      wait_for:
        host: "{{ rhel_vm_ip }}"
        port: 22
        delay: 5
        timeout: "{{ boot_timeout }}"
      register: ssh_check

    - name: Compute /24 subnet for "{{ rhel_vm_ip }}"
      set_fact:
        vm_ip_subnet: "{{ rhel_vm_ip.split('.')[0:3] | join('.') }}.*"

    - name: Add generic SSH config rule for "{{ vm_ip_subnet }}"
      blockinfile:
        path: "{{ ansible_env.HOME }}/.ssh/config"
        create: yes
        mode: '0600'
        marker: "# {mark} ANSIBLE MANAGED BLOCK - {{ vm_ip_subnet }}"
        block: |
          Host {{ vm_ip_subnet }}
              User {{ ec2_user }}
              IdentityFile {{ ssh_private_key_file }}
              IdentitiesOnly yes
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR
      delegate_to: localhost

    - name: Add VM to in-memory inventory
      add_host:
        name: "{{ vm_name }}"
        ansible_host: "{{ rhel_vm_ip }}"
        groups: new_vms
        rhel_username: "{{ rhel_username }}"
        rhel_password: "{{ rhel_password }}"

    - name: Summary
      debug:
        msg: |
          Ready for hardening!
          Connect to VM: ssh {{ ec2_user }}@{{ rhel_vm_ip }}
          Run hardening playbook with:
          ansible-playbook -i {{ rhel_vm_ip }}, hardening.yml

    - name: Save VM IP to file
      copy:
        content: "{{ rhel_vm_ip }}"
        dest: ".vm_ip"
      delegate_to: localhost

- name: Run verification on new VM
  hosts: new_vms
  gather_facts: yes
  become: yes
  vars:
    # Connection (user, IdentityFile, StrictHostKeyChecking) comes entirely
    # from the ~/.ssh/config "Host {{ vm_name }}" block written in the prior
    # play - ec2_user here is only needed for the sudoers path/line below and
    # must match ec2_user in the first play's vars.
    ec2_user: "ec2-user"
    verification_playbook: verify.yml
    run_verification: true
  tasks:
    - name: Configure passwordless sudo
      lineinfile:
        path: "/etc/sudoers.d/{{ ec2_user }}"
        line: "{{ ec2_user }} ALL=(ALL) NOPASSWD:ALL"
        create: yes
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'

    - name: Register with subscription-manager
      command: |
        subscription-manager register --username {{ rhel_username }} --password {{ rhel_password }} --force
      environment:
        LANG: en_US.UTF-8
      when: rhel_username != ""

    - name: Verify VM is responsive
      debug:
        msg: "VM {{ inventory_hostname }} is online and accessible"
      when: run_verification

    - name: Run verification playbook
      include_tasks: "{{ verification_playbook }}"
      ignore_errors: yes
      when: run_verification

- name: Display hardening instructions
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Output VM details for hardening
      debug:
        msg: |
          VM is ready for hardening!
          Run hardening playbooks with: ./run.sh hardening
          Or run individual playbooks from the support/ directory
