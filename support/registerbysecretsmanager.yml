---
- name: Register RHEL 10 servers to Satellite capsule
  hosts: all
  become: true
  gather_facts: false
 
  vars:
    secret_name: rhel10-register
    aws_region: us-gov-east-1
 
  tasks:
    - name: Pull registration command from AWS Secrets Manager
      ansible.builtin.set_fact:
        register_cmd: "{{ (lookup('amazon.aws.secretsmanager_secret', secret_name, region=aws_region) | from_json)['key'] }}"
      delegate_to: localhost
      run_once: true
      become: false
      no_log: true
 
    - name: Unregister leftover golden image registration
      ansible.builtin.command: subscription-manager unregister
      register: sm_unregister
      changed_when: sm_unregister.rc == 0
      failed_when: false
 
    - name: Force clean local subscription data
      ansible.builtin.command: subscription-manager clean
      changed_when: true
 
    - name: Run registration script
      ansible.builtin.shell: "{{ register_cmd }}"
      args:
        executable: /bin/bash
      no_log: true

